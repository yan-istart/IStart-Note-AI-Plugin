name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Build plugin
        run: |
          npm ci
          npm run ci
          cmp manifest.json dist/manifest.json
          test "${GITHUB_REF_NAME}" = "$(node -p 'require("./manifest.json").version')"

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
            dist/publishing-service.cjs
            dist/publishing-mcp.cjs

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          assets="dist/main.js dist/manifest.json dist/publishing-service.cjs dist/publishing-mcp.cjs dist/THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_PUBLISHING_NOTICES.txt"
          if [ -f "dist/styles.css" ]; then
            assets="$assets dist/styles.css"
          fi
          gh release create "$tag" \
            --title="$tag" \
            --generate-notes \
            $assets
